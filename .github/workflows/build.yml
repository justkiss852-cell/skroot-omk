# =====================================================================
#  Oh My Keymint for SKRoot(Pro) —— 云编译工作流
#  放到仓库的 .github/workflows/build.yml
#  Actions → Build SKRoot OMK module → Run workflow → 下载 artifacts
# =====================================================================
name: Build SKRoot OMK module

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SKRoot SDK repo
        run: git clone --depth 1 https://github.com/abcz316/SKRoot-linuxKernelRoot.git skroot

      - name: Fetch Oh My Keymint release binaries
        run: |
          set -e
          curl -L --retry 3 -o omk.zip \
            "https://github.com/qwq233/OhMyKeymint/releases/download/1.3.0-7742865/OhMyKeymint-release-arm64-v8a-1.3.0-7742865.zip"
          mkdir -p omk_rel && unzip -o omk.zip -d omk_rel > /dev/null
          ls -l omk_rel/libs/arm64-v8a/

      - name: Assemble module tree
        run: |
          set -e
          MOD="skroot/Pro(众测开放中)/src/testModule/module_oh_my_keymint"
          mkdir -p "$MOD/jni" "$MOD/resources/omk" "$MOD/webroot" "$MOD/wwwroot"

          # --- 模块源码 ---
          cp module_oh_my_keymint.cpp omk_utils.h "$MOD/"

          # --- WebUI（没有 index.html 也能编译，只是没页面）---
          if [ -f index.html ]; then
            cp index.html "$MOD/webroot/index.html"
            cp index.html "$MOD/wwwroot/index.html"
          fi

          # --- OMK 官方文件：二进制 + 原版脚本/配置 ---
          cp omk_rel/libs/arm64-v8a/keymint  "$MOD/resources/omk/keymint"
          cp omk_rel/libs/arm64-v8a/inject   "$MOD/resources/omk/inject"
          cp omk_rel/daemon omk_rel/daemon-injector \
             omk_rel/keybox.xml omk_rel/injector.toml "$MOD/resources/omk/"
          cp omk_rel/sepolicy.rule "$MOD/resources/sepolicy.rule"
          cp skroot_start.sh "$MOD/resources/omk/skroot_start.sh"
          chmod +x "$MOD/resources/omk/skroot_start.sh" \
                   "$MOD/resources/omk/daemon" \
                   "$MOD/resources/omk/daemon-injector"

          # --- jni 编译文件 ---
          cat > "$MOD/jni/Android.mk" <<'MK'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := module_oh_my_keymint
          LOCAL_SRC_FILES := $(LOCAL_PATH)/../module_oh_my_keymint.cpp
          KERNEL_MODULE_KIT := $(LOCAL_PATH)/../../kernel_module_kit
          LOCAL_C_INCLUDES += $(KERNEL_MODULE_KIT)/include
          LOCAL_C_INCLUDES += $(LOCAL_PATH)/..
          LOCAL_LDFLAGS += $(KERNEL_MODULE_KIT)/lib/libkernel_module_kit_static.a
          include $(LOCAL_PATH)/build_macros.mk
          include $(BUILD_SHARED_LIBRARY)
          MK

          cat > "$MOD/jni/Application.mk" <<'MK'
          APP_ABI := arm64-v8a
          APP_STL := c++_static
          MK

          cat > "$MOD/jni/build_macros.mk" <<'MK'
          COMMON_CPPFLAGS := \
              -std=c++20 \
              -fPIC \
              -fvisibility=hidden \
              -fno-stack-protector \
              -ffunction-sections \
              -fdata-sections \
              -flto=thin
          COMMON_LDFLAGS := \
              -Wl,-O2 \
              -Wl,--gc-sections \
              -Wl,-s \
              -flto=thin
          COMMON_INCLUDES := \
              $(LOCAL_PATH)/../../
          LOCAL_CPPFLAGS += $(COMMON_CPPFLAGS)
          LOCAL_LDFLAGS += $(COMMON_LDFLAGS)
          LOCAL_C_INCLUDES += $(COMMON_INCLUDES)
          MK

          echo "----- module tree -----"
          find "$MOD" -maxdepth 2 -type f | sort

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Build libmodule_oh_my_keymint.so
        run: |
          set -e
          export PATH="${{ steps.ndk.outputs.ndk-path }}:$PATH"
          MOD="skroot/Pro(众测开放中)/src/testModule/module_oh_my_keymint"
          cd "$MOD/jni"
          ndk-build -j4 || true
          if [ ! -f "$MOD/libs/arm64-v8a/libmodule_oh_my_keymint.so" ]; then
            echo "在 jni 目录编译失败，改用显式参数重试"
            cd "$MOD"
            ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j4
          fi
          ls -l "$MOD/libs/arm64-v8a/"

      - name: Package SKRoot module zip
        run: |
          set -e
          MOD="skroot/Pro(众测开放中)/src/testModule/module_oh_my_keymint"
          STAGE="$GITHUB_WORKSPACE/package"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp "$MOD/libs/arm64-v8a/libmodule_oh_my_keymint.so" "$STAGE/"
          cp -r "$MOD/resources/." "$STAGE/"
          if [ -d "$MOD/webroot" ]; then cp -r "$MOD/webroot" "$STAGE/webroot"; fi
          if [ -d "$MOD/wwwroot" ]; then cp -r "$MOD/wwwroot" "$STAGE/wwwroot"; fi
          chmod 0755 "$STAGE"/omk/* 2> /dev/null || true
          cd "$STAGE"
          zip -qr "$GITHUB_WORKSPACE/module_oh_my_keymint.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l module_oh_my_keymint.zip
          ls -lh module_oh_my_keymint.zip

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module_oh_my_keymint
          path: module_oh_my_keymint.zip
